name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checkers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python -m pip install "sushicore[typer]>=0.10.2"
        run: python -m pip install "sushicore[typer]>=0.10.2"
      - name: python tools/check_all.py .
        run: python tools/check_all.py .
